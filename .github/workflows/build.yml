name: Build (Windows + Linux x64)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GAME_NAME: DeadlyAssault
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  export:
    name: Export Windows & Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot and export templates
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"
          godot --version

      - name: Import project assets
        run: godot --headless --import || true

      - name: Export Windows (x86_64)
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" "build/windows/${GAME_NAME}.exe"

      - name: Export Linux (x86_64)
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" "build/linux/${GAME_NAME}.x86_64"
          chmod +x "build/linux/${GAME_NAME}.x86_64"

      - name: Verify outputs
        run: |
          test -s "build/windows/${GAME_NAME}.exe"
          test -s "build/linux/${GAME_NAME}.x86_64"
          ls -lh build/windows build/linux

      - name: Package
        run: |
          (cd build/windows && zip -r "../${GAME_NAME}-windows-x86_64.zip" .)
          tar -czf "build/${GAME_NAME}-linux-x86_64.tar.gz" -C build/linux .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_NAME }}-windows-x86_64
          path: build/${{ env.GAME_NAME }}-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_NAME }}-linux-x86_64
          path: build/${{ env.GAME_NAME }}-linux-x86_64.tar.gz

  release:
    name: Publish GitHub Release
    needs: export
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
